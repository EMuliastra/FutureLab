<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Future Lab — A Story Told by ANDY</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
/* =========================================================================
   FUTURE LAB — STORY GAME STYLES
   Palette lifted from the SCIFI reference: deep indigo night, violet neon,
   cyan light-lines and amber "lava" glows.
   ========================================================================= */

:root {
  --ink: #e9ecff;
  --ink-dim: #a9b0e0;
  --navy: #0a0d2e;
  --indigo: #1c2170;
  --violet: #8b6cff;
  --violet-hot: #a98bff;
  --cyan: #5ad8ff;
  --teal: #4ff0d0;
  --amber: #ffb24a;
  --pink: #ff6fae;
  --panel: rgba(18, 22, 74, .62);
  --panel-edge: rgba(150, 140, 255, .55);
  --accent: var(--cyan);
  --display: 'Orbitron', 'Segoe UI', system-ui, sans-serif;
  --body: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #02030c; overflow: hidden; }
body { font-family: var(--body); color: var(--ink); user-select: none; -webkit-user-select: none; }
button { font: inherit; color: inherit; cursor: pointer; }
kbd {
  font-family: var(--display); font-size: .8em; padding: .1em .45em; border-radius: 4px;
  border: 1px solid rgba(169, 176, 224, .5); background: rgba(255, 255, 255, .06);
}

/* ---------- Fixed 16:9 stage, scaled to fit ---------- */
#viewport { position: fixed; inset: 0; display: grid; place-items: center; }
#stage {
  position: absolute; left: 50%; top: 50%;
  width: 1600px; height: 900px; overflow: hidden; overflow: clip;
  transform-origin: 0 0; background: #05061a;
}

/* ---------- Background ---------- */
.bg { position: absolute; inset: 0; opacity: 0; transition: opacity 1.6s ease; }
.bg.show { opacity: 1; }
.bg-pan {
  position: absolute; inset: -4%;
  will-change: transform;
  animation: kenburns 38s ease-in-out infinite alternate;
}
.bg img {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: cover; object-position: 50% 62%;
}
.bg-edge { mix-blend-mode: screen; opacity: .9; }
@keyframes kenburns {
  from { transform: scale(1.02) translate(0, 0); }
  to   { transform: scale(1.09) translate(-1.5%, -1%); }
}
#bgShade {
  position: absolute; inset: 0; pointer-events: none;
  background:
    radial-gradient(ellipse at 70% 30%, transparent 30%, rgba(3, 3, 18, .35) 85%),
    linear-gradient(to bottom, rgba(4, 4, 24, .55), transparent 38%, transparent 62%, rgba(3, 3, 16, .7));
}
#sky, #embers { position: absolute; inset: 0; width: 1600px; height: 900px; pointer-events: none; }
#sky { mix-blend-mode: screen; -webkit-mask-image: linear-gradient(#000 45%, transparent 80%); mask-image: linear-gradient(#000 45%, transparent 80%); }
#embers { mix-blend-mode: screen; }

/* Floating rock shards (nod to the SCIFI reference) */
#rocks { position: absolute; inset: 0; pointer-events: none; }
.rock { position: absolute; animation: float 9s ease-in-out infinite alternate; filter: drop-shadow(0 0 18px rgba(255, 160, 60, .25)); }
.rock svg { display: block; }
@keyframes float { from { transform: translateY(-10px) rotate(-2deg); } to { transform: translateY(14px) rotate(2deg); } }

/* ---------- ANDY ---------- */
#andy {
  position: absolute; left: 18px; bottom: 26px; width: 400px; height: 660px;
  z-index: 6; pointer-events: none;
  opacity: 0; transform: translateX(-60px);
  transition: opacity .8s ease, transform .9s cubic-bezier(.2, .8, .2, 1);
}
#andy.show { opacity: 1; transform: none; }
#andy img {
  position: absolute; left: 50%; bottom: 34px; height: 620px; translate: -50% 0;
  filter: drop-shadow(0 0 2px rgba(255, 255, 255, .6)) drop-shadow(0 0 22px rgba(90, 216, 255, .45));
  animation: idle 4.2s ease-in-out infinite;
  transform-origin: 50% 100%;
}
#andy.talking img { animation: idle 4.2s ease-in-out infinite, talk .32s ease-in-out infinite alternate; }
@keyframes idle { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
@keyframes talk { from { scale: 1 1; } to { scale: 1.006 .994; } }
.andy-pad {
  position: absolute; left: 50%; bottom: 8px; width: 330px; height: 60px; translate: -50% 0;
}
.andy-pad span {
  position: absolute; inset: 0; border-radius: 50%;
  border: 2px solid var(--accent); box-shadow: 0 0 18px var(--accent), inset 0 0 18px var(--accent);
  opacity: .8;
}
.andy-pad span:nth-child(2) { inset: 10px 40px; opacity: .5; animation: padPulse 2.6s ease-out infinite; }
.andy-pad span:nth-child(3) { inset: -8px -24px; opacity: 0; animation: padPulse 2.6s 1.3s ease-out infinite; }
@keyframes padPulse { from { transform: scale(.7); opacity: .7; } to { transform: scale(1.25); opacity: 0; } }
.andy-beam {
  position: absolute; left: 50%; bottom: 30px; width: 300px; height: 0; translate: -50% 0;
  background: linear-gradient(to top, color-mix(in srgb, var(--accent) 55%, transparent), transparent);
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
  mask-image: linear-gradient(90deg, transparent, #000 30%, #000 70%, transparent);
  opacity: 0;
}
#andy.beaming .andy-beam { animation: beam 1.6s ease-out forwards; }
#andy.beaming img { animation: beamIn 1.4s ease-out both; }
@keyframes beam { 0% { height: 0; opacity: 0; } 30% { height: 700px; opacity: 1; } 100% { height: 700px; opacity: 0; } }
@keyframes beamIn {
  0% { clip-path: inset(100% -80px -80px -80px); filter: brightness(3) drop-shadow(0 0 30px var(--cyan)); }
  60% { clip-path: inset(-80px -80px -80px -80px); filter: brightness(1.6) drop-shadow(0 0 30px var(--cyan)); }
  100% { clip-path: inset(-80px -80px -80px -80px); }
}

/* ---------- Dialogue ---------- */
#dialogue {
  position: absolute; left: 400px; right: 40px; bottom: 30px; height: 222px; z-index: 7;
  padding: 26px 34px 18px 38px;
  background: linear-gradient(135deg, rgba(28, 30, 104, .78), rgba(12, 14, 52, .82));
  border: 1px solid var(--panel-edge);
  border-radius: 6px 22px 6px 22px;
  box-shadow: 0 0 0 1px rgba(90, 216, 255, .08) inset, 0 0 40px rgba(110, 90, 255, .25), 0 20px 50px rgba(0, 0, 0, .5);
  backdrop-filter: blur(8px);
  opacity: 0; transform: translateY(30px); transition: opacity .6s, transform .6s cubic-bezier(.2, .8, .2, 1);
  cursor: pointer;
}
#dialogue.show { opacity: 1; transform: none; }
#dialogue::before {
  content: ''; position: absolute; left: 22px; right: 22px; top: -1px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent), var(--violet), transparent);
  box-shadow: 0 0 12px var(--accent);
}
.dlg-tag {
  position: absolute; top: -18px; left: 34px; padding: 6px 18px 6px 14px;
  font: 700 15px/1 var(--display); letter-spacing: .16em;
  background: linear-gradient(90deg, #6b4dff, #3b5bff);
  border-radius: 3px 12px 3px 12px; box-shadow: 0 0 18px rgba(120, 100, 255, .7);
}
.dlg-tag em { font-style: normal; font-weight: 500; opacity: .7; }
.dlg-tag .dot {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 10px;
  background: var(--teal); box-shadow: 0 0 8px var(--teal); vertical-align: 1px;
  animation: blink 1.2s steps(2) infinite;
}
.dlg-chapter {
  position: absolute; top: 12px; right: 30px;
  font: 500 12px/1 var(--display); letter-spacing: .2em; color: var(--ink-dim); text-transform: uppercase;
}
#dlgText {
  margin: 14px 0 0; min-height: 120px;
  font: 500 28px/1.4 var(--body); letter-spacing: .005em;
  text-shadow: 0 0 18px rgba(120, 140, 255, .35);
}
#dlgText .cur { display: inline-block; width: .5em; height: 1em; margin-left: 2px; vertical-align: -.12em; background: var(--accent); animation: blink .8s steps(2) infinite; }
.dlg-foot { position: absolute; left: 38px; right: 30px; bottom: 16px; display: flex; align-items: center; justify-content: space-between; }
#lineDots { display: flex; gap: 8px; }
#lineDots i { width: 22px; height: 4px; border-radius: 2px; background: rgba(169, 176, 224, .25); transition: background .3s, box-shadow .3s; }
#lineDots i.on { background: var(--accent); box-shadow: 0 0 8px var(--accent); }
.dlg-nav { display: flex; gap: 10px; }
.dlg-nav button, .hud-btns button {
  font: 600 12px/1 var(--display); letter-spacing: .14em;
  padding: 9px 14px; border-radius: 3px 10px 3px 10px;
  background: rgba(255, 255, 255, .05); border: 1px solid rgba(169, 176, 224, .35);
  transition: background .2s, border-color .2s, box-shadow .2s;
}
.dlg-nav button:hover, .hud-btns button:hover { background: rgba(139, 108, 255, .25); border-color: var(--violet-hot); }
.dlg-caret { position: absolute; right: 200px; bottom: 18px; color: var(--accent); font-size: 14px; opacity: 0; animation: bob 1s ease-in-out infinite; }
#dialogue.ready .dlg-caret { opacity: 1; }
@keyframes bob { 50% { transform: translateY(4px); } }
@keyframes blink { 50% { opacity: 0; } }

/* ---------- HUD ---------- */
#hud {
  position: absolute; left: 0; right: 0; top: 0; height: 64px; z-index: 8;
  display: flex; align-items: center; gap: 30px; padding: 0 34px;
  opacity: 0; transition: opacity .6s;
}
#hud.show { opacity: 1; }
.hud-brand { font: 900 16px/1 var(--display); letter-spacing: .2em; white-space: nowrap; }
.hud-brand b { color: #fff; text-shadow: 0 0 12px var(--violet); }
.hud-brand span { font-weight: 500; font-size: 12px; color: var(--ink-dim); margin-left: 10px; }
#chapterBar { flex: 1; display: flex; gap: 5px; }
#chapterBar i { flex: 1; height: 4px; border-radius: 2px; background: rgba(169, 176, 224, .18); transition: background .4s, box-shadow .4s; }
#chapterBar i.done { background: rgba(139, 108, 255, .7); }
#chapterBar i.now { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.hud-btns { display: flex; gap: 8px; }
.hud-btns button.on { background: rgba(90, 216, 255, .18); border-color: var(--accent); box-shadow: 0 0 12px rgba(90, 216, 255, .4); }

/* ---------- Chapter card ---------- */
#card {
  position: absolute; inset: 0; z-index: 9; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: radial-gradient(ellipse at center, rgba(16, 14, 60, .78), rgba(3, 3, 16, .92));
  opacity: 0; pointer-events: none; transition: opacity .6s;
}
#card.show { opacity: 1; pointer-events: auto; }
.card-num { font: 600 20px/1 var(--display); letter-spacing: .5em; color: var(--accent); text-shadow: 0 0 14px var(--accent); margin: 28px 0 18px; }
.card-title {
  margin: 0 0 28px; max-width: 1200px; text-align: center;
  font: 900 64px/1.12 var(--display); letter-spacing: .04em; text-transform: uppercase;
  background: linear-gradient(180deg, #ffffff, #b9a8ff 60%, #7d5cff);
  -webkit-background-clip: text; background-clip: text; color: transparent;
  filter: drop-shadow(0 0 22px rgba(139, 108, 255, .6));
}
.card-line { width: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--accent), transparent); box-shadow: 0 0 10px var(--accent); }
#card.show .card-line { animation: line 1.2s .2s cubic-bezier(.2, .8, .2, 1) forwards; }
#card.show .card-num, #card.show .card-title { animation: rise .9s .25s cubic-bezier(.2, .8, .2, 1) both; }
@keyframes line { to { width: 760px; } }
@keyframes rise { from { opacity: 0; transform: translateY(18px); letter-spacing: .3em; } }

/* ---------- Screens (title / menu / end) ---------- */
.screen {
  position: absolute; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .8s;
}
.screen.show { opacity: 1; pointer-events: auto; }
#title { background: radial-gradient(ellipse at 50% 40%, rgba(40, 30, 140, .25), rgba(2, 2, 12, .55) 75%); }
.title-wrap { text-align: center; position: relative; z-index: 2; }
.title-kicker { font: 600 15px/1 var(--display); letter-spacing: .5em; color: var(--ink-dim); margin-bottom: 26px; }
.title-logo { display: inline-flex; flex-direction: column; align-items: stretch; gap: 14px; }
.tl-rule { height: 4px; border: 2px solid var(--violet-hot); border-radius: 2px; box-shadow: 0 0 14px var(--violet), inset 0 0 6px var(--violet); }
.title-logo h1 {
  margin: 0; padding: 0 20px; white-space: nowrap;
  font: 900 128px/1 var(--display); letter-spacing: .06em;
  color: transparent; -webkit-text-stroke: 3px #c9b8ff;
  text-shadow: 0 0 18px rgba(139, 108, 255, .9), 0 0 60px rgba(139, 108, 255, .5);
  animation: neon 5s ease-in-out infinite;
}
.title-logo.small h1 { font-size: 84px; }
@keyframes neon { 0%, 100% { -webkit-text-stroke-color: #c9b8ff; } 48% { -webkit-text-stroke-color: #c9b8ff; } 50% { -webkit-text-stroke-color: #6d5ad8; } 52% { -webkit-text-stroke-color: #c9b8ff; } }
.title-sub { font: 500 22px/1 var(--display); letter-spacing: .4em; margin: 30px 0 46px; color: var(--ink); }
.title-sub b { color: var(--teal); text-shadow: 0 0 12px var(--teal); }
.big-btn {
  display: block; margin: 0 auto 16px; padding: 18px 46px;
  font: 700 18px/1 var(--display); letter-spacing: .2em;
  background: linear-gradient(90deg, #7b5cff, #4d6bff); border: 0; border-radius: 4px 16px 4px 16px;
  box-shadow: 0 0 28px rgba(123, 92, 255, .7); transition: transform .2s, box-shadow .2s;
}
.big-btn:hover { transform: translateY(-2px) scale(1.02); box-shadow: 0 0 44px rgba(123, 92, 255, .95); }
.ghost-btn {
  padding: 12px 30px; font: 600 13px/1 var(--display); letter-spacing: .2em;
  background: transparent; border: 1px solid rgba(169, 176, 224, .45); border-radius: 3px 12px 3px 12px;
}
.ghost-btn:hover { border-color: var(--violet-hot); background: rgba(139, 108, 255, .15); }
.title-hint { margin-top: 40px; font-size: 15px; color: var(--ink-dim); }
.whale { position: absolute; left: -500px; top: 70px; width: 460px; opacity: .85; animation: swim 46s linear infinite; z-index: 1; }
.whale svg { width: 100%; filter: drop-shadow(0 0 20px rgba(90, 120, 255, .45)); animation: float 6s ease-in-out infinite alternate; }
.whale-glow { fill: none; stroke: var(--cyan); stroke-width: 2; stroke-dasharray: 6 10; filter: drop-shadow(0 0 4px var(--cyan)); animation: dash 3s linear infinite; }
.whale-glow.amber { stroke: var(--amber); filter: drop-shadow(0 0 4px var(--amber)); }
@keyframes swim { from { transform: translateX(0); } to { transform: translateX(2700px); } }
@keyframes dash { to { stroke-dashoffset: -64; } }

#menu { background: rgba(2, 3, 14, .78); backdrop-filter: blur(6px); }
.menu-panel {
  width: 860px; padding: 36px 44px; text-align: center;
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 6px 24px 6px 24px;
  box-shadow: 0 0 50px rgba(110, 90, 255, .35);
}
.menu-panel h3 { margin: 0 0 22px; font: 900 26px/1 var(--display); letter-spacing: .3em; }
#menuList { list-style: none; margin: 0 0 24px; padding: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; text-align: left; }
#menuList button {
  width: 100%; padding: 12px 16px; text-align: left; background: rgba(255, 255, 255, .04);
  border: 1px solid rgba(169, 176, 224, .2); border-radius: 3px 10px 3px 10px; font-size: 16px;
}
#menuList button:hover, #menuList button.now { border-color: var(--accent); background: rgba(90, 216, 255, .12); }
#menuList small { display: block; font: 600 11px/1 var(--display); letter-spacing: .2em; color: var(--accent); margin-bottom: 5px; }

#end { background: radial-gradient(ellipse at center, rgba(40, 20, 80, .55), rgba(4, 2, 14, .88)); }
.end-wrap { text-align: center; max-width: 1100px; }
.end-tag { font: 700 20px/1 var(--display); letter-spacing: .45em; margin: 26px 0 34px; color: var(--amber); text-shadow: 0 0 16px rgba(255, 178, 74, .7); }
.end-andy { font-size: 26px; line-height: 1.5; margin: 0 auto 36px; max-width: 900px; }
.end-andy b { font-family: var(--display); color: var(--teal); letter-spacing: .1em; }
.end-btns { display: flex; justify-content: center; align-items: center; gap: 18px; }
.end-btns .big-btn { margin: 0; }
.sources { margin-top: 44px; font-size: 13px; color: var(--ink-dim); line-height: 1.7; }
.sources a { color: var(--ink-dim); }

/* =========================================================================
   SCENE TOOLKIT
   Elements carry data-at="n": they gain .on when narration reaches line n.
   data-x="n:class" adds a class when narration reaches line n.
   Elements are positioned with left/top + the `translate` property so that
   `transform` stays free for animation.
   ========================================================================= */
#fx { position: absolute; left: 440px; top: 70px; width: 1120px; height: 540px; z-index: 5; pointer-events: none; }
#fx > .scene { position: absolute; inset: 0; transition: opacity .8s; }
#fx > .scene.leaving { opacity: 0; }
.abs { position: absolute; translate: -50% -50%; width: max-content; }
[data-at] {
  opacity: 0; transform: var(--from, translateY(24px) scale(.94));
  transition: opacity .7s ease, transform .9s cubic-bezier(.2, .8, .2, 1), scale 1.1s cubic-bezier(.6, 0, .2, 1), left 1.1s cubic-bezier(.6, 0, .2, 1), top 1.1s cubic-bezier(.6, 0, .2, 1), filter .6s;
  transition-delay: var(--d, 0s);
}
[data-at].on { opacity: 1; transform: none; }
svg [data-at] { transform: none; }
.dim { filter: grayscale(.8) brightness(.45) !important; }

.holo {
  background: linear-gradient(160deg, rgba(40, 46, 140, .55), rgba(14, 16, 60, .7));
  border: 1px solid color-mix(in srgb, var(--c, var(--cyan)) 70%, transparent);
  border-radius: 4px 14px 4px 14px;
  box-shadow: 0 0 22px color-mix(in srgb, var(--c, var(--cyan)) 35%, transparent), inset 0 0 18px color-mix(in srgb, var(--c, var(--cyan)) 15%, transparent);
  backdrop-filter: blur(4px);
}
.holo-label { font: 700 15px/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; }
.ico { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.glowtext { font-family: var(--display); font-weight: 900; text-transform: uppercase; letter-spacing: .08em; text-shadow: 0 0 18px var(--c, var(--violet)); }
.chip {
  display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; white-space: nowrap;
  font: 600 18px/1 var(--body); color: #fff;
}
.chip .ico { width: 22px; height: 22px; color: var(--c, var(--cyan)); }
.lines { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.lines line, .lines path { fill: none; stroke: var(--c, var(--cyan)); stroke-width: 2; }
.lines .flow { stroke-dasharray: 6 9; animation: dash 1.6s linear infinite; }
.lines .glow { filter: drop-shadow(0 0 5px var(--c, var(--cyan))); }

/* People */
.person { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.person svg { overflow: visible; filter: drop-shadow(0 0 10px var(--c, var(--cyan))); }
.person .p-body { fill: color-mix(in srgb, var(--c, var(--cyan)) 35%, #0d1040); stroke: var(--c, var(--cyan)); stroke-width: 2.5; }
.person .p-head { fill: color-mix(in srgb, var(--c, var(--cyan)) 25%, #f6d7bf); stroke: var(--c, var(--cyan)); stroke-width: 2.5; }
.person .p-tag { font: 700 11px/1 var(--display); letter-spacing: .12em; color: var(--c, var(--cyan)); text-transform: uppercase; }
.bob { animation: idle 3.6s ease-in-out infinite; animation-delay: var(--bd, 0s); }

/* Ch1 — flying keywords */
.fly {
  position: absolute; left: 50%; top: 50%; translate: -50% -50%;
  opacity: 0; animation: fly var(--dur, 3s) cubic-bezier(.5, 0, .9, .6) forwards;
}
@keyframes fly {
  0%   { transform: translate(0, 0) scale(.15); opacity: 0; }
  14%  { opacity: 1; }
  80%  { opacity: 1; }
  100% { transform: translate(var(--tx), var(--ty)) scale(1.7); opacity: 0; }
}
.ring {
  position: absolute; border-radius: 50%; border: 2px solid var(--c, var(--cyan));
  box-shadow: 0 0 18px var(--c, var(--cyan)), inset 0 0 18px var(--c, var(--cyan));
}
.ring.pulse { animation: ringPulse 3s ease-out infinite; animation-delay: var(--rd, 0s); }
@keyframes ringPulse { from { transform: scale(.4); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }
.strike { position: relative; }
.strike::after {
  content: ''; position: absolute; left: -4%; top: 52%; height: 4px; width: 0; background: var(--amber);
  box-shadow: 0 0 12px var(--amber); transition: width .7s .3s ease;
}
.strike.struck::after { width: 108%; }
.struck { opacity: .45 !important; }

/* Ch2 — the gap */
.fissure { filter: drop-shadow(0 0 10px var(--amber)) drop-shadow(0 0 24px rgba(255, 140, 40, .6)); }
.tension line { stroke: var(--amber) !important; }
.calm line { stroke: var(--teal) !important; }
.tower .win { fill: rgba(90, 216, 255, .25); }
.tower.lit .win { fill: #9ff0ff; filter: drop-shadow(0 0 4px #9ff0ff); }

/* Ch3 — orbs */
.orb {
  width: 170px; height: 170px; border-radius: 50%; display: grid; place-items: center;
  font: 900 34px/1 var(--display); letter-spacing: .08em;
  background: radial-gradient(circle at 35% 30%, color-mix(in srgb, var(--c) 60%, #fff), var(--c) 45%, color-mix(in srgb, var(--c) 40%, #000) 100%);
  box-shadow: 0 0 40px var(--c), 0 0 90px color-mix(in srgb, var(--c) 50%, transparent);
  text-shadow: 0 2px 10px rgba(0, 0, 0, .5);
}
.orb small { display: block; font: 600 10px/1.2 var(--display); letter-spacing: .12em; margin-top: 4px; text-align: center; }
.core {
  width: 230px; height: 230px; border-radius: 50%; display: grid; place-items: center; text-align: center;
  background: radial-gradient(circle, rgba(255, 255, 255, .95) 0, #c7b6ff 18%, rgba(123, 92, 255, .6) 45%, transparent 70%);
  font: 900 26px/1.1 var(--display); color: #1a1050; letter-spacing: .08em;
}
.spin { animation: spin 18s linear infinite; }
.spin.rev { animation-direction: reverse; animation-duration: 26s; }
@keyframes spin { to { rotate: 360deg; } }

/* Ch4 — flip badges */
.flip { perspective: 800px; width: 176px; height: 92px; }
.flip-in { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 1s cubic-bezier(.4, 1.6, .5, 1); transition-delay: var(--fd, 0s); }
.flip.flipped .flip-in { transform: rotateY(180deg); }
.flip-face {
  position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; text-align: center; padding: 6px;
}
.flip-face.back { transform: rotateY(180deg); }
.flip-face .ico { width: 30px; height: 30px; color: var(--c); }
.flip-face b { font: 700 14px/1.15 var(--display); letter-spacing: .08em; text-transform: uppercase; }
.flip-face.front b { color: var(--ink-dim); letter-spacing: .3em; }
.grow { transition: transform .9s cubic-bezier(.3, 1.6, .5, 1); transition-delay: var(--fd, 0s); }
.grown { transform: scale(1.14) translateY(-8px); }
.pulseglow { animation: pg 1.8s ease-in-out infinite; }
@keyframes pg { 50% { filter: brightness(1.5) drop-shadow(0 0 14px var(--c, var(--cyan))); } }

/* Ch5 — meters */
.meter { width: 220px; padding: 12px 16px; }
.meter b { font: 700 12px/1 var(--display); letter-spacing: .2em; display: flex; justify-content: space-between; }
.meter .bar { height: 8px; margin-top: 10px; border-radius: 4px; background: rgba(255, 255, 255, .08); overflow: hidden; }
.meter .bar i { display: block; height: 100%; width: 8%; border-radius: 4px; background: linear-gradient(90deg, var(--c), #fff); box-shadow: 0 0 10px var(--c); transition: width 1.6s cubic-bezier(.2, .8, .2, 1); }
.meter.full .bar i { width: 100%; }
.node-dot { fill: var(--c, var(--cyan)); filter: drop-shadow(0 0 6px var(--c, var(--cyan))); }
.skill { padding: 10px 16px; }

/* Ch6 — pipeline */
.station { width: 170px; height: 170px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; filter: grayscale(.6) brightness(.6); transition: filter .8s, box-shadow .8s, opacity .7s, transform .9s cubic-bezier(.2, .8, .2, 1); }
.station .ico { width: 54px; height: 54px; color: var(--c); }
.station.lit { filter: none; box-shadow: 0 0 40px var(--c), inset 0 0 26px color-mix(in srgb, var(--c) 30%, transparent); }
.real { font: 900 15px/1.25 var(--display); letter-spacing: .12em; text-align: center; color: var(--c); text-shadow: 0 0 12px var(--c); }
.traveller {
  width: 30px; height: 30px; border-radius: 50%; background: #fff;
  box-shadow: 0 0 18px #fff, 0 0 40px var(--teal), 0 0 80px var(--teal);
  transition: left 1.3s cubic-bezier(.6, 0, .2, 1), opacity .6s;
}
.traveller.p1 { left: 140px !important; } .traveller.p2 { left: 420px !important; }
.traveller.p3 { left: 700px !important; } .traveller.p4 { left: 980px !important; }

/* Ch7 — artefacts → services */
.art { width: 170px; padding: 12px 14px; rotate: var(--r, 0deg); transition: left 1.2s cubic-bezier(.6, 0, .2, 1), top 1.2s cubic-bezier(.6, 0, .2, 1), rotate 1.2s, opacity .7s, transform .9s, filter .6s; }
.art .ico { width: 22px; height: 22px; color: var(--c); }
.art span { display: block; font: 600 14px/1.25 var(--body); margin-top: 6px; }
.art .mini { display: flex; gap: 4px; margin-top: 8px; }
.art .mini i { flex: 1; height: 5px; border-radius: 2px; background: color-mix(in srgb, var(--c) 55%, transparent); }
.art.cluster { left: var(--cx) !important; top: var(--cy) !important; rotate: var(--cr, 0deg); }
.art.gone { opacity: 0 !important; transform: scale(.6) !important; }
.scan { animation: scan 1.6s ease-in-out infinite; }
@keyframes scan { 50% { box-shadow: 0 0 34px var(--c), inset 0 0 22px color-mix(in srgb, var(--c) 40%, transparent); } }
.crystal { width: 90px; height: 90px; rotate: 45deg; border-radius: 10px; background: linear-gradient(135deg, #fff, var(--c) 40%, transparent); box-shadow: 0 0 40px var(--c); opacity: .9; }
.service { width: 280px; height: 210px; padding: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 12px; }
.service .ico { width: 48px; height: 48px; color: var(--c); }
.service b { font: 700 19px/1.2 var(--display); letter-spacing: .06em; text-transform: uppercase; }
.service span { font-size: 15px; color: var(--ink-dim); }

/* Ch8 — catalogue */
.cat-head { font: 900 22px/1 var(--display); letter-spacing: .4em; color: #fff; text-shadow: 0 0 16px var(--teal); }
.cat-grid { display: grid; grid-template-columns: repeat(4, 254px); gap: 16px; }
.cat-card { height: 176px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.cat-card .ico { width: 34px; height: 34px; color: var(--c); }
.cat-card b { font: 700 16px/1.2 var(--display); letter-spacing: .05em; }
.cat-card span { font-size: 15px; color: var(--ink-dim); }
.cat-card .idx { margin-top: auto; font: 600 11px/1 var(--display); letter-spacing: .2em; color: var(--c); }

/* Ch9 — comparison */
.side { width: 500px; height: 500px; padding: 28px 30px; display: flex; flex-direction: column; gap: 14px; }
.side h4 { margin: 0 0 6px; font: 900 22px/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; }
.side.old { background: linear-gradient(160deg, rgba(70, 72, 90, .55), rgba(30, 30, 40, .7)); border: 1px solid rgba(180, 180, 200, .35); border-radius: 4px; filter: grayscale(1); }
.side.old h4 { color: #b8bccb; }
.old-row { display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: rgba(255, 255, 255, .05); border: 1px solid rgba(255, 255, 255, .1); color: #a9acb8; font-size: 18px; }
.old-row i { width: 14px; height: 14px; border: 2px solid #8a8d99; }
.side.new h4 { color: #fff; text-shadow: 0 0 14px var(--pink); }
.trait { justify-content: flex-start; font-size: 19px; padding: 11px 16px; }
.vs { font: 900 40px/1 var(--display); color: var(--amber); text-shadow: 0 0 20px var(--amber); }
.plus-pill { display: flex; align-items: center; gap: 10px; font: 700 13px/1 var(--display); letter-spacing: .14em; }

/* Ch10 — challenge → outcome */
.flip.tall { width: 232px; height: 150px; }
.flip.tall .flip-face b { font-size: 15px; }
.flip.tall .flip-face small { font: 600 10px/1 var(--display); letter-spacing: .25em; color: var(--c); }
.backed { padding: 14px 22px; font: 700 15px/1 var(--display); letter-spacing: .16em; display: flex; align-items: center; gap: 12px; }

/* Ch11 — next */
.orbit-label { padding: 12px 20px; font: 700 15px/1 var(--display); letter-spacing: .16em; }
.city { font: 600 13px/1 var(--display); letter-spacing: .14em; fill: var(--ink); }
.city-dot { fill: #fff; filter: drop-shadow(0 0 6px var(--amber)) drop-shadow(0 0 14px var(--amber)); }
.city-dot.home { fill: var(--amber); }

/* Finale */
.table-glow { width: 520px; height: 120px; border-radius: 50%; background: radial-gradient(ellipse, rgba(255, 210, 140, .8), rgba(255, 140, 90, .25) 50%, transparent 72%); }
.skyline rect { fill: rgba(255, 190, 140, .14); stroke: rgba(255, 200, 150, .7); stroke-width: 1.5; }
.skyline .w { fill: rgba(255, 220, 160, .8); stroke: none; }
.final-logo h1 { font-size: 70px; }
.final-logo { gap: 10px; }
.tagword { font: 900 30px/1 var(--display); letter-spacing: .2em; color: var(--amber); text-shadow: 0 0 18px var(--amber); }
.heart { color: var(--pink); }

/* Prologue */
.badge-intro { padding: 16px 26px; display: flex; align-items: center; gap: 16px; }
.badge-intro .avatar { width: 52px; height: 52px; border-radius: 50%; background: radial-gradient(circle at 40% 35%, #fff, var(--teal) 60%, #0b3a40); box-shadow: 0 0 20px var(--teal); }
.badge-intro b { display: block; font: 900 26px/1 var(--display); letter-spacing: .14em; }
.badge-intro span { font: 600 12px/1 var(--display); letter-spacing: .24em; color: var(--teal); }
.hello { font: 900 110px/1 var(--display); color: transparent; -webkit-text-stroke: 2px #bff6ff; text-shadow: 0 0 30px rgba(90, 216, 255, .8); letter-spacing: .08em; }

/* Shared state classes used by scenes */
.gone { opacity: 0 !important; transform: scale(.85) !important; }
.faded { opacity: .14 !important; }
.mL { left: 450px !important; top: 70px !important; scale: .55; }
.mR { left: 670px !important; top: 70px !important; scale: .55; }
.rock polygon { fill: var(--rock, #141a52); stroke: color-mix(in srgb, var(--rock, #141a52) 60%, #8a90ff); stroke-width: 1.5; }
.rock polyline { fill: none; stroke: var(--amber); stroke-width: 2.5; filter: drop-shadow(0 0 4px var(--amber)); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .2s !important; }
}

    data: '<path d="M4 20V11M10 20V5M16 20v-6M22 20H2"/>',
    leaf: '<path d="M5 19c0-8 6-14 15-14 0 9-6 15-14 15"/><path d="M5 19l8-8"/>',
    cloud: '<path d="M7 18h10a4 4 0 0 0 0-8 6 6 0 0 0-11.5 1.5A3.5 3.5 0 0 0 7 18z"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/>',
    people: '<circle cx="9" cy="8" r="3.2"/><circle cx="17" cy="9" r="2.6"/><path d="M3 20c0-3.5 2.7-6 6-6s6 2.5 6 6M15 14.5c3 0 6 2 6 5"/>',
    bulb: '<path d="M9 18h6M10 21h4"/><path d="M12 3a6 6 0 0 0-4 10.5c.8.8 1 1.5 1 2.5h6c0-1 .2-1.7 1-2.5A6 6 0 0 0 12 3z"/>',

    code: '<path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/>',
    target: '<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>',
    briefcase: '<rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2M2 13h20"/>',
    search: '<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
    access: '<circle cx="12" cy="4" r="2"/><path d="M4 8l8 2 8-2M12 10v5l-3 7M12 15l3 7"/>',
    rocket: '<path d="M5 15c-1.5 1.3-2 5-2 5s3.7-.5 5-2"/><path d="M9 15l-3-3c1-4 4.5-9 13-9 0 8.5-5 12-9 13z"/><circle cx="15" cy="9" r="1.5"/>',
    monitor: '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>',
    cog: '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',
    map: '<path d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3z"/><path d="M9 3v15M15 6v15"/>',
    building: '<rect x="4" y="2" width="16" height="20" rx="1"/><path d="M9 22v-4h6v4M8 6h2M14 6h2M8 10h2M14 10h2M8 14h2M14 14h2"/>',
    sparkle: '<path d="M12 2l2.5 7.5L22 12l-7.5 2.5L12 22l-2.5-7.5L2 12l7.5-2.5z"/>',
    clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    link: '<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>',
    globe: '<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>',
    heart: '<path d="M12 21s-8-5.2-8-11a4.5 4.5 0 0 1 8-2.8A4.5 4.5 0 0 1 20 10c0 5.8-8 11-8 11z"/>',
    bolt: '<path d="M13 2L4 14h7l-1 8 9-12h-7z"/>',
    star: '<path d="M12 2.5l2.9 6 6.6.9-4.8 4.6 1.2 6.5L12 17.4l-5.9 3.1 1.2-6.5L2.5 9.4l6.6-.9z"/>'
  };
  const icon = (n, extra = '') => `<svg class="ico" ${extra} viewBox="0 0 24 24">${ICONS[n] || ''}</svg>`;

  const C = {
    cyan: '#5ad8ff', violet: '#a98bff', teal: '#4ff0d0', amber: '#ffb24a',
    pink: '#ff6fae', blue: '#6f8cff', gold: '#ffd36e', coral: '#ff8a6a'
  };

  /* Attribute helpers */
  const pos = (x, y, extra = '') => `left:${x}px;top:${y}px;${extra}`;
  const at = (n, d = 0, from) => `data-at="${n}" ` + (d || from ? `style-x="--d:${d}s;${from ? `--from:${from};` : ''}"` : '');

  /* Turn an HTML string into an element, merging the style-x helper attr into style. */
  function el(html) {
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    t.content.querySelectorAll('[style-x]').forEach(n => {
      n.setAttribute('style', (n.getAttribute('style') || '') + ';' + n.getAttribute('style-x'));
      n.removeAttribute('style-x');
    });
    return t.content.firstElementChild;
  }
  const add = (root, html) => { const n = el(html); root.appendChild(n); return n; };

  function personSVG(scale = 1, badge = true) {
    const w = 75 * scale, h = 125 * scale;
    return `<svg width="${w}" height="${h}" viewBox="0 0 60 100">
      <path class="p-body" d="M8 98 C8 64 16 46 30 46 C44 46 52 64 52 98 Z"/>
      <circle class="p-head" cx="30" cy="24" r="14"/>
      ${badge ? '<rect x="24" y="62" width="12" height="8" rx="2" fill="currentColor" opacity=".85"/>' : ''}
    </svg>`;
  }
  function person(x, y, c, attrs = '', { scale = 1, tag = '', bd = 0 } = {}) {
    return `<div class="abs person" style="${pos(x, y, `--c:${c};color:${c};`)}" ${attrs}>
      <div class="bob" style="--bd:${bd}s">${personSVG(scale)}</div>
      ${tag ? `<div class="p-tag">${tag}</div>` : ''}
    </div>`;
  }

  /* Tiny deterministic random so the network looks the same every play */
  function rng(seed) { return () => (seed = (seed * 16807) % 2147483647) / 2147483647; }

  const SCENES = {};

  /* ---------------------------------------------------------------- PROLOGUE */
  SCENES.prologue = {
    build(root) {
      add(root, `<div class="abs hello" style="${pos(560, 105)}" ${at(0, .9)}>HELLO!</div>`);
      add(root, `<div class="abs holo badge-intro" style="${pos(560, 235, '--c:#4ff0d0')}" ${at(0, 1.4)}>
          <div class="avatar"></div><div><b>ANDY</b><span>FUTURE LAB GUIDE · SINCE DAY ONE</span></div></div>`);
      // Intern → professional growth
      add(root, person(360, 410, C.cyan, at(1, 0), { scale: .8, tag: 'Intern' }));
      add(root, `<svg class="abs lines" style="${pos(560, 410, 'width:200px;height:40px;')}" viewBox="0 0 200 40" ${at(1, .5)}>
          <path class="flow glow" d="M10 20 H180" style="--c:${C.teal}"/><path d="M170 8 L190 20 L170 32" style="--c:${C.teal}"/></svg>`);
      add(root, person(760, 395, C.amber, at(1, 1), { scale: 1.15, tag: 'Professional' }));
      add(root, `<div class="abs" style="${pos(808, 318, `color:${C.gold}`)}" ${at(1, 1.5)}>${icon('sparkle', 'style="width:34px;height:34px;filter:drop-shadow(0 0 8px #ffd36e)"')}</div>`);
      add(root, `<div class="abs holo chip" style="${pos(560, 515, '--c:#a98bff')}" ${at(2, 0)}>${icon('rocket')} STORY UPLINK READY</div>`);
    }
  };

  /* --------------------------------------------------------- CH1 THE WORLD */
  SCENES.world = {
    build(root, api) {
      const words = [
        ['AI', 'chip', C.cyan], ['DATA', 'data', C.teal], ['SUSTAINABILITY', 'leaf', '#7dff9a'],
        ['DIGITAL TRANSFORMATION', 'cloud', C.violet], ['CUSTOMER EXPECTATIONS', 'user', C.pink]
      ];
      const field = add(root, `<div style="position:absolute;inset:0"></div>`);
      add(root, `<div class="ring pulse abs" style="${pos(560, 270, 'width:180px;height:180px;--c:#5ad8ff')}"></div>`);
      add(root, `<div class="ring pulse abs" style="${pos(560, 270, 'width:180px;height:180px;--c:#a98bff;--rd:1.5s')}"></div>`);

      let k = 0;
      this.rate = 700;
      const spawn = () => {
        const [label, ic, c] = words[k++ % words.length];
        const a = Math.random() * Math.PI * 2;
        const n = el(`<div class="fly holo chip" style="--c:${c};--tx:${Math.cos(a) * 760}px;--ty:${Math.sin(a) * 420}px;--dur:${2.4 + Math.random()}s">${icon(ic)}${label}</div>`);
        n.addEventListener('animationend', () => n.remove());
        field.appendChild(n);
        api.later(spawn, this.rate * (0.6 + Math.random() * 0.8));
      };
      api.later(spawn, 300);

      add(root, `<div class="abs glowtext strike" style="${pos(560, 215, 'font-size:46px;--c:#a98bff')}" ${at(2, 0)} data-x="3:struck">WILL CHANGE HAPPEN?</div>`);
      add(root, `<div class="abs holo chip" style="${pos(560, 330, '--c:#ffb24a;font-size:30px;padding:18px 30px;font-family:Orbitron,sans-serif;font-weight:900;letter-spacing:.06em')}" ${at(3, .5)}>${icon('clock', 'style="width:34px;height:34px"')} HOW QUICKLY CAN WE ADAPT?</div>`);
    },
    step(i, api) {
      this.rate = [650, 420, 1100, 260][i] ?? 600;
      api.setWarp(i === 2 ? 0.35 : i === 3 ? 1.8 : 1);
    }
  };

  /* ------------------------------------------------------------- CH2 THE GAP */
  SCENES.gap = {
    build(root) {
      // chasm / fissure
      add(root, `<svg class="abs lines fissure" style="${pos(560, 505, 'width:1120px;height:60px')}" viewBox="0 0 1120 60" ${at(0, 0)}>
          <path style="--c:${C.amber};stroke-width:3" d="M40 30 L120 22 L170 36 L250 24 L320 38 L390 26 L470 34"/>
          <path style="--c:${C.amber};stroke-width:3" d="M650 34 L720 24 L800 38 L860 22 L950 36 L1010 26 L1080 30"/></svg>`);
      // tension lines from forces to the company
      add(root, `<svg class="abs lines tension" style="${pos(560, 270, 'width:1120px;height:540px')}" viewBox="0 0 1120 540" ${at(0, .6)} data-x="3:calm">
          <line class="flow glow" x1="270" y1="110" x2="500" y2="230"/><line class="flow glow" x1="850" y1="110" x2="620" y2="230"/>
          <line class="flow glow" x1="270" y1="410" x2="500" y2="330"/><line class="flow glow" x1="850" y1="410" x2="620" y2="330"/></svg>`);
      // company tower
      let wins = '';
      for (let r = 0; r < 7; r++) for (let c = 0; c < 4; c++) wins += `<rect class="win" x="${22 + c * 26}" y="${46 + r * 26}" width="14" height="14" rx="2"/>`;
      add(root, `<div class="abs tower" style="${pos(560, 300)}" ${at(0, 0)} data-x="3:lit">
          <svg width="150" height="270" viewBox="0 0 150 270" style="overflow:visible;filter:drop-shadow(0 0 16px #5ad8ff)">
            <path d="M75 0 V24" stroke="#5ad8ff" stroke-width="3"/><circle cx="75" cy="4" r="4" fill="#ffb24a"/>
            <path d="M10 250 V36 L75 22 L140 36 V250 Z" fill="rgba(40,60,160,.45)" stroke="#5ad8ff" stroke-width="2.5"/>
            ${wins}
            <rect x="58" y="226" width="34" height="24" fill="rgba(90,216,255,.4)"/>
            <ellipse cx="75" cy="256" rx="95" ry="12" fill="none" stroke="#5ad8ff" stroke-width="2" opacity=".7"/>
          </svg>
          <div class="holo-label" style="text-align:center;margin-top:4px;color:#9fe8ff;font-size:12px">YOUR ORGANISATION</div></div>`);
      const force = (x, y, label, ic, c, n, extra = '') =>
        add(root, `<div class="abs holo chip" style="${pos(x, y, `--c:${c};font-size:17px;padding:14px 20px`)}" ${at(n, .2)} ${extra}>${icon(ic)}${label}</div>`);
      force(170, 110, 'Business Challenges', 'briefcase', C.amber, 0);
      force(950, 110, 'Emerging Technologies', 'chip', C.cyan, 1, 'data-x="2:dim"');
      force(170, 410, 'Skills Shortages', 'people', C.pink, 1);
      force(950, 410, 'Innovation Demands', 'sparkle', C.violet, 0);
      add(root, `<div class="abs holo chip" style="${pos(880, 190, '--c:#4ff0d0;font-size:14px')}" ${at(1, .6)} data-x="2:dim">${icon('data')}DATA</div>`);
      add(root, `<div class="abs holo chip" style="${pos(1010, 190, '--c:#5ad8ff;font-size:14px')}" ${at(1, .8)} data-x="2:dim">${icon('chip')}AI</div>`);

      add(root, `<div class="abs glowtext" style="${pos(560, 20, 'font-size:30px;--c:#ffb24a;white-space:nowrap')}" ${at(2, 0)} data-x="3:gone">MORE THAN TECHNOLOGY…</div>`);
      [['Fresh thinking', 'bulb', C.gold, 300], ['Diverse perspectives', 'people', C.pink, 560], ['Challenge assumptions', 'bolt', C.teal, 830]]
        .forEach(([t, ic, c, x], j) => add(root, `<div class="abs holo chip" style="${pos(x, 20, `--c:${c}`)}" ${at(3, .2 + j * .25)}>${icon(ic)}${t}</div>`));
      // people bridging the gap
      add(root, `<svg class="abs lines" style="${pos(560, 492, 'width:1120px;height:20px')}" viewBox="0 0 1120 20" ${at(3, .4)}>
          <path class="glow" style="--c:${C.teal};stroke-width:4" d="M300 10 H820"/></svg>`);
      [[330, C.cyan], [420, C.pink], [700, C.gold], [790, C.violet]].forEach(([x, c], j) =>
        add(root, person(x, 442, c, at(3, .6 + j * .2), { scale: .9, bd: j * .4 })));
    }
  };

  /* ----------------------------------------------------- CH3 BIRTH OF FUTURE LAB */
  SCENES.birth = {
    build(root) {
      add(root, `<div class="abs ring spin" style="${pos(560, 300, 'width:300px;height:300px;--c:#a98bff;border-style:dashed')}" ${at(1, 1)}></div>`);
      add(root, `<div class="abs ring spin rev" style="${pos(560, 300, 'width:380px;height:380px;--c:#5ad8ff;opacity:.5;border-width:1px')}" ${at(1, 1.2)}></div>`);
      add(root, `<div class="abs core" style="${pos(560, 300)}" ${at(1, .9, 'scale(.2)')}>FUTURE<br>LAB</div>`);

      add(root, `<div class="abs orb" style="${pos(200, 260, '--c:#4f7dff')}" ${at(0, .2, 'translateX(-260px)')} data-x="1:mL">IBM</div>`);
      add(root, `<div class="abs orb" style="${pos(920, 260, '--c:#13b8a4')}" ${at(0, .6, 'translateX(260px)')} data-x="1:mR"><div>ECU<small>EDITH COWAN<br>UNIVERSITY</small></div></div>`);
      add(root, `<svg class="abs lines" style="${pos(560, 70, 'width:200px;height:40px')}" viewBox="0 0 200 40" ${at(1, 1.4)}>
          <path class="flow glow" style="--c:#fff" d="M20 20 H180"/></svg>`);

      add(root, `<div class="abs holo chip" style="${pos(560, 505, '--c:#ffd36e;font-size:17px;padding:14px 24px')}" ${at(2, 0)}>${icon('star')}SHARED VISION · TALENT · SKILLS · SOLUTIONS FOR THE FUTURE WORKFORCE</div>`);

      add(root, `<div class="abs holo chip" style="${pos(170, 200, '--c:#4ff0d0;font-size:20px')}" ${at(3, 0, 'translateX(-60px)')}>${icon('bulb')}LEARNING</div>`);
      add(root, `<div class="abs holo chip" style="${pos(950, 200, '--c:#6f8cff;font-size:20px')}" ${at(3, .2, 'translateX(60px)')}>${icon('building')}INDUSTRY</div>`);
      add(root, `<svg class="abs lines" style="${pos(560, 270, 'width:1120px;height:540px')}" viewBox="0 0 1120 540" ${at(3, .5)}>
          <path class="flow glow" style="--c:#4ff0d0" d="M260 200 Q360 230 420 280"/><path class="flow glow" style="--c:#6f8cff" d="M860 200 Q760 230 700 280"/>
          <path class="flow" style="--c:#a98bff" d="M150 360 L440 320 M260 380 L450 340 M970 360 L680 320 M860 380 L670 340" data-at="4"/></svg>`);
      add(root, person(150, 370, C.cyan, at(4, 0), { scale: .8, tag: 'Student' }));
      add(root, person(262, 390, C.teal, at(4, .2), { scale: .8, tag: 'Graduate', bd: .5 }));
      add(root, person(858, 390, C.violet, at(4, .4), { scale: .95, tag: 'Practitioner', bd: .3 }));
      add(root, person(970, 370, C.blue, at(4, .6), { scale: .95, tag: 'Expert', bd: .8 }));
    }
  };

  /* ------------------------------------------------ CH4 MORE THAN AN INTERNSHIP */
  SCENES.roles = {
    build(root) {
      const roles = [
        ['Designer', 'pen', C.pink], ['Developer', 'code', C.cyan], ['Data Specialist', 'data', C.teal],
        ['Project Manager', 'target', C.amber], ['Consultant', 'briefcase', C.violet]
      ];
      const xs = [130, 340, 560, 780, 990];
      // community links (arcs)
      add(root, `<svg class="abs lines" style="${pos(560, 270, 'width:1120px;height:540px')}" viewBox="0 0 1120 540" ${at(1, 1.6)}>
          ${xs.slice(0, -1).map((x, j) => `<path class="flow glow" style="--c:${C.violet}" d="M${x + 30} 230 Q${(x + xs[j + 1]) / 2} 170 ${xs[j + 1] - 30} 230"/>`).join('')}
          <path class="flow" style="--c:${C.cyan}" d="M130 230 Q560 60 990 230" opacity=".6"/></svg>`);
      // beams to the goal
      add(root, `<svg class="abs lines" style="${pos(560, 270, 'width:1120px;height:540px')}" viewBox="0 0 1120 540" ${at(3, .3)}>
          ${xs.map(x => `<line class="flow glow" style="--c:${C.gold}" x1="${x}" y1="235" x2="560" y2="70"/>`).join('')}</svg>`);
      add(root, `<div class="abs" style="${pos(560, 60, `color:${C.gold}`)}" ${at(3, 0, 'scale(.2)')}>
          <div class="pulseglow" style="--c:${C.gold}">${icon('star', 'style="width:84px;height:84px;fill:rgba(255,211,110,.35);stroke-width:1.4"')}</div></div>`);
      add(root, `<div class="abs holo chip" style="${pos(270, 60, '--c:#ffd36e')}" ${at(4, 0, 'translateX(-40px)')}>${icon('target')}Meaningful problems</div>`);
      add(root, `<div class="abs holo chip" style="${pos(850, 60, '--c:#ffd36e')}" ${at(4, .3, 'translateX(40px)')}>${icon('heart')}Value for clients</div>`);

      roles.forEach(([name, ic, c], j) => {
        add(root, `<div class="abs" style="${pos(xs[j], 290, `--c:${c};color:${c}`)}" ${at(0, j * .15)}>
            <div class="grow person" style="--fd:${.4 + j * .25}s" data-x="1:grown"><div class="bob" style="--bd:${j * .3}s">${personSVG(1.05)}</div></div></div>`);
        add(root, `<div class="abs flip" style="${pos(xs[j], 412)}" ${at(0, .3 + j * .15)} data-x="1:flipped 2:pulseglow">
            <div class="flip-in" style="--fd:${.4 + j * .25}s">
              <div class="flip-face front holo" style="--c:#8a90c0"><b>INTERN</b></div>
              <div class="flip-face back holo" style="--c:${c}">${icon(ic)}<b>${name}</b></div>
            </div></div>`);
      });
    }
  };

  /* ---------------------------------------------------- CH5 GROWING CAPABILITY */
  SCENES.network = {
    build(root) {
      const cx = 470, cy = 280, R = rng(7);
      const rings = [[6, 95, 0], [11, 165, 1], [16, 235, 2]];
      const nodes = [{ x: cx, y: cy, ring: -1 }];
      let svgLinks = '', svgNodes = '';
      const cols = [C.cyan, C.violet, C.teal, C.pink, C.amber];
      rings.forEach(([n, r, step], ri) => {
        for (let k = 0; k < n; k++) {
          const a = (k / n) * Math.PI * 2 + ri * .4 + (R() - .5) * .3;
          const rr = r + (R() - .5) * 26;
          const p = { x: cx + Math.cos(a) * rr, y: cy + Math.sin(a) * rr * .88, ring: ri };
          // connect to nearest node in the previous ring
          let best = nodes[0], bd = 1e9;
          nodes.filter(q => q.ring === ri - 1).forEach(q => { const d = (q.x - p.x) ** 2 + (q.y - p.y) ** 2; if (d < bd) { bd = d; best = q; } });
          const c = cols[Math.floor(R() * cols.length)];
          const d = (.1 + k * .06).toFixed(2);
          svgLinks += `<line class="glow" data-at="${step}" style="--c:${c};--d:${d}s;opacity:.55" x1="${best.x}" y1="${best.y}" x2="${p.x}" y2="${p.y}"/>`;
          svgNodes += `<circle class="node-dot" data-at="${step}" style="--c:${c};--d:${(+d + .3).toFixed(2)}s" cx="${p.x}" cy="${p.y}" r="${ri === 0 ? 8 : 6 - ri}"/>`;
          nodes.push(p);
        }
      });
      // collaboration cross-links (community)
      const outer = nodes.filter(n => n.ring >= 1);
      for (let k = 0; k < outer.length; k++) {
        const a = outer[k], b = outer[(k + 5) % outer.length];
        svgLinks += `<line class="flow" data-at="3" style="--c:${C.teal};--d:${(k * .05).toFixed(2)}s;opacity:.45" x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}"/>`;
      }
      add(root, `<svg class="lines" viewBox="0 0 1120 540">${svgLinks}${svgNodes}</svg>`);
      add(root, `<div class="abs core" style="${pos(cx, cy, 'width:150px;height:150px;font-size:17px')}" ${at(0, 0, 'scale(.3)')}>FUTURE<br>LAB</div>`);

      const skills = [['Design', 'pen', C.pink], ['Technology', 'code', C.cyan], ['Analytics', 'data', C.teal],
        ['AI', 'chip', C.blue], ['Business', 'briefcase', C.amber], ['Strategy', 'target', C.violet]];

<script>
/* =========================================================================
   FUTURE LAB — STORY ENGINE
   ========================================================================= */

(function () {
  const $ = s => document.querySelector(s);
  const stage = $('#stage');
  const STORY = window.STORY;

  /* ---------------------------------------------------------------------------
     Fit the 1600 × 900 stage to the window
  --------------------------------------------------------------------------- */
  function fit() {
    const s = Math.min(innerWidth / 1600, innerHeight / 900);
    stage.style.transformOrigin = '50% 50%';
    stage.style.transform = `translate(-50%, -50%) scale(${s})`;
  }
  addEventListener('resize', fit);
  fit();

  /* ---------------------------------------------------------------------------
     Colour grades. The sample backgrounds are pale daytime landscapes; each
     theme gradient-maps their luminance onto a night-sky sci-fi palette and
     traces their contours with neon light (edge filter).
     Stops are [luminance, colour]; luminance values are tuned to the art:
     trees/roofs ≈ .5, castle ≈ .6, ground ≈ .8, far hills ≈ .88,
     sky ≈ .91, clouds ≈ .94.
  --------------------------------------------------------------------------- */
  const THEMES = {
    deepspace: { accent: '#5ad8ff', edge: '#5ad8ff', rock: '#121848',
      stops: ['#05061a', '#1a1250', '#4b2fa8', '#34489e', '#121640', '#0a0d2c', '#222a78', '#141a52', '#2e2f86', '#6a5ae0'] },
    nebula:    { accent: '#a98bff', edge: '#a98bff', rock: '#1a1250',
      stops: ['#07051c', '#241465', '#7a3fd0', '#4060c8', '#170f48', '#100a33', '#34278a', '#1c1660', '#4a2fa0', '#9b6cff'] },
    aurora:    { accent: '#4ff0d0', edge: '#4ff0d0', rock: '#0c1f44',
      stops: ['#031418', '#0e2e5a', '#1fa3b8', '#3a6fd0', '#0b2040', '#071631', '#1b4a86', '#0f1f58', '#1f6f9a', '#46e0d0'] },
    twilight:  { accent: '#ff9a5a', edge: '#ff9a5a', rock: '#22103e',
      stops: ['#12061e', '#3a1250', '#c0477a', '#6a4ac8', '#1e0f40', '#150a30', '#4a2a8a', '#241a62', '#7a3a9a', '#ff8fb0'] },
    dawn:      { accent: '#ffc070', edge: '#ffc070', rock: '#2a1848',
      stops: ['#140818', '#3a1a50', '#ff8a4a', '#8a6ae0', '#2a1848', '#1e1238', '#7a4a9a', '#3a2a7a', '#e0789a', '#ffd08a'] }
  };
  //            deep  struct0 struct1 struct2 ground2 ground  haze   sky    cloud  top
  const AT = [0, .40, .50, .62, .72, .82, .876, .905, .944, 1];

  const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16) / 255);
  function table(stops) {
    const N = 256, ch = [[], [], []];
    const cols = stops.map(hex);
    for (let i = 0; i < N; i++) {
      const L = i / (N - 1);
      let k = 0;
      while (k < AT.length - 2 && L > AT[k + 1]) k++;
      const t = Math.min(1, Math.max(0, (L - AT[k]) / (AT[k + 1] - AT[k])));
      for (let c = 0; c < 3; c++) ch[c].push((cols[k][c] + (cols[k + 1][c] - cols[k][c]) * t).toFixed(3));
    }
    return ch.map(a => a.join(' '));
  }
  (function buildFilters() {
    const LUM = '.2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  .2126 .7152 .0722 0 0  0 0 0 1 0';
    let out = '';
    for (const [name, th] of Object.entries(THEMES)) {
      const [r, g, b] = table(th.stops);
      const [er, eg, eb] = hex(th.edge);
      out += `
        <filter id="grade-${name}" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="${LUM}"/>
          <feComponentTransfer>
            <feFuncR type="table" tableValues="${r}"/><feFuncG type="table" tableValues="${g}"/><feFuncB type="table" tableValues="${b}"/>
          </feComponentTransfer>
        </filter>
        <filter id="edge-${name}" color-interpolation-filters="sRGB">
          <feColorMatrix type="matrix" values="${LUM}" result="L"/>
          <feConvolveMatrix in="L" order="3" kernelMatrix="-1 -1 -1 -1 8 -1 -1 -1 -1" edgeMode="duplicate" preserveAlpha="true" result="E1"/>
          <feConvolveMatrix in="L" order="3" kernelMatrix="1 1 1 1 -8 1 1 1 1" edgeMode="duplicate" preserveAlpha="true" result="E2"/>
          <feComposite in="E1" in2="E2" operator="arithmetic" k2="1" k3="1" result="E"/>
          <feColorMatrix in="E" type="matrix" values="0 0 0 0 ${er}  0 0 0 0 ${eg}  0 0 0 0 ${eb}  9 0 0 0 0" result="C"/>
          <feGaussianBlur in="C" stdDeviation="3.5" result="B"/>
          <feMerge><feMergeNode in="B"/><feMergeNode in="B"/><feMergeNode in="C"/></feMerge>
        </filter>`;
    }
    $('#filters').innerHTML = out;
  })();

  /* ---------------------------------------------------------------------------
     Background layers
  --------------------------------------------------------------------------- */
  const bgLayers = [$('#bgA'), $('#bgB')];
  let bgFront = 0, bgCurrent = '';
  function setBackground(file, theme) {
    const key = file + theme;
    const th = THEMES[theme];
    stage.style.setProperty('--accent', th.accent);
    stage.style.setProperty('--rock', th.rock);
    if (key === bgCurrent) return;
    bgCurrent = key;
    const next = bgLayers[1 - bgFront], prev = bgLayers[bgFront];
    const [base, edge] = next.querySelectorAll('img');
    // ASSET_DATA is filled in by the single-file build (build.ps1)
    base.src = edge.src = (window.ASSET_DATA && window.ASSET_DATA[file]) || 'assets/' + file;
    base.style.filter = `url(#grade-${theme})`;
    edge.style.filter = `url(#edge-${theme})`;
    next.classList.add('show');
    prev.classList.remove('show');
    bgFront = 1 - bgFront;
  }

  /* ---------------------------------------------------------------------------
     Starfield (drift ↔ hyperspace) and rising embers
  --------------------------------------------------------------------------- */
  const sky = $('#sky').getContext('2d');
  const emb = $('#embers').getContext('2d');
  const W = 1600, H = 900;
  const stars = Array.from({ length: 320 }, () => newStar(true));
  function newStar(any) { return { x: (Math.random() * 2 - 1) * 1.2, y: (Math.random() * 2 - 1) * 1.2, z: any ? Math.random() : 1, tw: Math.random() * 6.28 }; }
  const embers = Array.from({ length: 46 }, () => newEmber(true));
  function newEmber(any) { return { x: Math.random() * W, y: any ? Math.random() * H : H + 10, v: .2 + Math.random() * .6, r: .8 + Math.random() * 2.2, s: Math.random() * 6.28 }; }
  let warp = .05, warpTarget = .05;
  function setWarp(v) { warpTarget = v; }

  let last = performance.now();
  function frame(t) {
    const dt = Math.min(50, t - last) / 16.67; last = t;
    warp += (warpTarget - warp) * .03 * dt;
    sky.clearRect(0, 0, W, H);
    const cx = W * .62, cy = H * .36, speed = (.0006 + warp * .012) * dt;
    for (const s of stars) {
      const pz = s.z;
      s.z -= speed;
      if (s.z <= .02) Object.assign(s, newStar(false));
      const sx = cx + (s.x / s.z) * W * .5, sy = cy + (s.y / s.z) * H * .5;
      if (sx < -50 || sx > W + 50 || sy < -50 || sy > H + 50) { Object.assign(s, newStar(false)); continue; }
      const px = cx + (s.x / pz) * W * .5, py = cy + (s.y / pz) * H * .5;
      const b = Math.min(1, (1 - s.z) * 1.4) * (.6 + .4 * Math.sin(t * .003 + s.tw));
      sky.strokeStyle = `rgba(200,220,255,${b})`;
      sky.lineWidth = Math.max(.6, (1 - s.z) * 2.4);
      sky.beginPath();
      if (warp > .3) { sky.moveTo(px, py); sky.lineTo(sx, sy); }
      else { sky.moveTo(sx, sy); sky.lineTo(sx + .1, sy + .1); }
      sky.stroke();
    }
    emb.clearRect(0, 0, W, H);
    for (const e of embers) {
      e.y -= e.v * dt; e.s += .02 * dt;
      e.x += Math.sin(e.s) * .3 * dt;
      if (e.y < H * .35) Object.assign(e, newEmber(false));
      const a = Math.min(1, (e.y - H * .35) / (H * .3));
      const g = emb.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 4);
      g.addColorStop(0, `rgba(255,200,110,${.9 * a})`); g.addColorStop(1, 'rgba(255,120,40,0)');
      emb.fillStyle = g;
      emb.beginPath(); emb.arc(e.x, e.y, e.r * 4, 0, 6.28); emb.fill();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* Floating rock shards, as in the SCIFI reference */
  [[40, 90, 1, 0], [1440, 80, .8, 2], [1490, 380, .55, 4], [330, 40, .45, 1]].forEach(([x, y, s, d]) => {
    $('#rocks').insertAdjacentHTML('beforeend', `<div class="rock" style="left:${x}px;top:${y}px;animation-delay:-${d}s">
      <svg width="${140 * s}" height="${170 * s}" viewBox="0 0 140 170">
        <polygon points="20,10 110,0 135,60 100,150 60,170 15,110 0,50"/>
        <polyline points="45,20 62,64 50,104 72,150"/><polyline points="62,64 98,80" style="stroke-width:1.6"/>
      </svg></div>`);
  });

  /* ---------------------------------------------------------------------------
     Sound: ambient pad, typing blips and chapter whooshes (Web Audio)
  --------------------------------------------------------------------------- */
  const Sound = {
    on: true, ctx: null, voices: [],
    init() {
      if (this.ctx) return;
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) { this.on = false; return; }
      const ctx = this.ctx = new AC();
      this.master = ctx.createGain(); this.master.gain.value = this.on ? .55 : 0;
      this.master.connect(ctx.destination);
      // spacey echo
      const delay = ctx.createDelay(); delay.delayTime.value = .42;
      const fb = ctx.createGain(); fb.gain.value = .38;
      this.wet = ctx.createGain(); this.wet.gain.value = .35;
      this.wet.connect(delay); delay.connect(fb); fb.connect(delay); delay.connect(this.master);
      this.music = ctx.createGain(); this.music.gain.value = .16;
      this.music.connect(this.master); this.music.connect(this.wet);
    },
    set(on) {
      this.on = on;
      if (this.ctx) this.master.gain.setTargetAtTime(on ? .55 : 0, this.ctx.currentTime, .2);
    },
    chord(freqs) {
      if (!this.ctx) return;
      const ctx = this.ctx, now = ctx.currentTime;
      this.voices.forEach(v => { v.g.gain.setTargetAtTime(0, now, 1.2); v.osc.forEach(o => o.stop(now + 6)); });
      const g = ctx.createGain(); g.gain.value = 0; g.gain.setTargetAtTime(1, now, 1.5);
      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.Q.value = .8;
      const lfo = ctx.createOscillator(), lfoG = ctx.createGain();
      lfo.frequency.value = .07; lfoG.gain.value = 420; lfo.connect(lfoG); lfoG.connect(lp.frequency);
      lp.connect(g); g.connect(this.music);
      const osc = [lfo];
      freqs.forEach(f => [-7, 7].forEach(det => {
        const o = ctx.createOscillator(), og = ctx.createGain();
        o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = det;
        og.gain.value = .5 / freqs.length;
        o.connect(og); og.connect(lp); osc.push(o);
      }));
      osc.forEach(o => o.start());
      this.voices = [{ g, osc }];
    },
    blip() {
      if (!this.ctx || !this.on) return;
      const ctx = this.ctx, t = ctx.currentTime;
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.type = 'square'; o.frequency.value = 1100 + Math.random() * 300;
      g.gain.setValueAtTime(.018, t); g.gain.exponentialRampToValueAtTime(.0001, t + .03);
      o.connect(g); g.connect(this.master); o.start(t); o.stop(t + .04);
    },
    whoosh() {
      if (!this.ctx || !this.on) return;
      const ctx = this.ctx, t = ctx.currentTime, len = 1.6;
      const buf = ctx.createBuffer(1, ctx.sampleRate * len, ctx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      const src = ctx.createBufferSource(); src.buffer = buf;
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 1.2;
      bp.frequency.setValueAtTime(250, t); bp.frequency.exponentialRampToValueAtTime(3200, t + 1.1);
      const g = ctx.createGain();
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.16, t + .5); g.gain.linearRampToValueAtTime(0, t + len);
      src.connect(bp); bp.connect(g); g.connect(this.master); g.connect(this.wet);
      src.start(t);
    }
  };
  // One chord per chapter; the progression brightens towards the finale.
  const CHORDS = [
    [110.00, 164.81, 246.94, 261.63], [87.31, 130.81, 196.00, 261.63, 329.63], [98.00, 146.83, 220.00, 293.66],
    [130.81, 196.00, 246.94, 329.63], [110.00, 164.81, 220.00, 329.63], [87.31, 174.61, 220.00, 261.63, 349.23],
    [98.00, 196.00, 246.94, 293.66], [130.81, 196.00, 261.63, 329.63, 392.00], [146.83, 220.00, 293.66, 349.23],
    [87.31, 130.81, 220.00, 261.63, 329.63], [98.00, 146.83, 196.00, 246.94, 293.66], [110.00, 164.81, 220.00, 277.18, 329.63],
    [130.81, 196.00, 261.63, 329.63, 392.00, 493.88]
  ];

  /* ---------------------------------------------------------------------------
     Voice narration (Web Speech API, optional)
  --------------------------------------------------------------------------- */
  const Voice = {
    on: false, voice: null,
    pick() {
      const vs = speechSynthesis.getVoices();
      const score = v => (v.lang === 'en-AU' ? 6 : v.lang.startsWith('en-GB') ? 4 : v.lang.startsWith('en') ? 2 : 0)
        + (/natural|online/i.test(v.name) ? 3 : 0) + (/james|william|ryan|george|guy|male|daniel/i.test(v.name) ? 1 : 0);
      this.voice = vs.sort((a, b) => score(b) - score(a))[0] || null;
    },
    speak(text, onEnd) {
      if (!this.on || !('speechSynthesis' in window)) return false;
      speechSynthesis.cancel();
      if (!this.voice) this.pick();
      const u = new SpeechSynthesisUtterance(text.replace(/—/g, ', '));
      if (this.voice) u.voice = this.voice;
      u.rate = .98; u.pitch = .95;
      u.onend = onEnd;
      speechSynthesis.speak(u);
      return true;
    },
    stop() { if ('speechSynthesis' in window) speechSynthesis.cancel(); }
  };
  if ('speechSynthesis' in window) speechSynthesis.onvoiceschanged = () => Voice.pick();

  /* ---------------------------------------------------------------------------
     Story flow
  --------------------------------------------------------------------------- */
  const fx = $('#fx'), andy = $('#andy'), dlg = $('#dialogue'), text = $('#dlgText');
  const S = { mode: 'title', ch: 0, line: 0, scene: null, sceneObj: null, timers: new Set(), typing: null, auto: false, autoT: null, cardT: null };

  const api = {
    later(fn, ms) {
      const id = setTimeout(() => { S.timers.delete(id); fn(); }, ms);
      S.timers.add(id);
      return id;
    },
    setWarp
  };
  function clearSceneTimers() { S.timers.forEach(clearTimeout); S.timers.clear(); }

  // chapter progress bar + menu
  $('#chapterBar').innerHTML = STORY.map(() => '<i></i>').join('');
  $('#menuList').innerHTML = STORY.map((c, i) => `<li><button data-ch="${i}"><small>${c.num}</small>${c.title}</button></li>`).join('');
  $('#sources').innerHTML = 'Sources: ' + window.STORY_SOURCES.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${s.label}</a>`).join(' · ');

  function updateBars() {
    document.querySelectorAll('#chapterBar i').forEach((n, i) => { n.className = i < S.ch ? 'done' : i === S.ch ? 'now' : ''; });
    document.querySelectorAll('#menuList button').forEach((b, i) => b.classList.toggle('now', i === S.ch));
    const lines = STORY[S.ch].lines.length;
    $('#lineDots').innerHTML = Array.from({ length: lines }, (_, i) => `<i class="${i <= S.line ? 'on' : ''}"></i>`).join('');
  }

  function buildScene(chapter) {
    clearSceneTimers();
    if (S.scene) {
      const old = S.scene;
      old.classList.add('leaving');
      setTimeout(() => old.remove(), 800);
    }
    const root = document.createElement('div');
    root.className = 'scene';
    fx.appendChild(root);
    S.scene = root;
    S.sceneObj = Object.create(window.SCENES[chapter.scene] || {});
    S.sceneObj.build && S.sceneObj.build(root, api);
  }

  /* Reveal every element whose beat has been reached; reverse ones that haven't. */
  function applyBeats(n) {
    if (!S.scene) return;
    S.scene.querySelectorAll('[data-at]').forEach(e => e.classList.toggle('on', +e.dataset.at <= n));
    S.scene.querySelectorAll('[data-x]').forEach(e => {
      e.dataset.x.split(/\s+/).forEach(rule => {
        const [k, cls] = rule.split(':');
        e.classList.toggle(cls, n >= +k);
      });
    });
    S.sceneObj.step && S.sceneObj.step(n, api);
  }

  function enterChapter(i, startLine = 0) {
    stopAuto(); stopTyping(); Voice.stop();
    S.ch = i; S.line = startLine; S.mode = 'card';
    const ch = STORY[i];
    setBackground(ch.bg, ch.theme);
    setWarp(ch.warp);
    Sound.whoosh();
    Sound.chord(CHORDS[i % CHORDS.length]);
    $('#cardNum').textContent = ch.num;
    $('#cardTitle').textContent = ch.title;
    $('#dlgChapter').textContent = `${ch.num} · ${ch.title}`;
    const card = $('#card');
    card.classList.remove('show'); void card.offsetWidth; card.classList.add('show');
    dlg.classList.remove('ready');
    text.textContent = '';
    updateBars();
    buildScene(ch);
    clearTimeout(S.cardT);
    S.cardT = setTimeout(endCard, 2900);
  }

  function endCard() {
    if (S.mode !== 'card') return;
    clearTimeout(S.cardT);
    $('#card').classList.remove('show');
    S.mode = 'play';
    // two frames so freshly built elements transition in
    requestAnimationFrame(() => requestAnimationFrame(() => goLine(S.line)));
  }

  function goLine(n) {
    stopAuto(); stopTyping(); Voice.stop();
    S.line = n;
    updateBars();
    applyBeats(n);
    const line = STORY[S.ch].lines[n];
    typeLine(line);
    const spoke = Voice.speak(line, () => { S.spoken = true; maybeAuto(); });
    S.spoken = !spoke;
  }

  function typeLine(str) {
    let i = 0;
    dlg.classList.remove('ready');
    andy.classList.add('talking');
    text.innerHTML = '<span></span><i class="cur"></i>';
    const span = text.firstChild;
    S.typing = setInterval(() => {
      i += 1;
      span.textContent = str.slice(0, i);
      if (i % 3 === 0 && str[i] !== ' ') Sound.blip();
      if (i >= str.length) finishTyping();
    }, 24);
    S.typingStr = str;
  }
  function finishTyping() {
    if (!S.typing) return;
    clearInterval(S.typing); S.typing = null;
    text.innerHTML = `<span>${S.typingStr}</span>`;
    andy.classList.remove('talking');
    dlg.classList.add('ready');
    maybeAuto();
  }
  function stopTyping() { if (S.typing) { clearInterval(S.typing); S.typing = null; } andy.classList.remove('talking'); }

  function maybeAuto() {
    if (!S.auto || S.typing || !S.spoken || S.mode !== 'play') return;
    clearTimeout(S.autoT);
    const words = (S.typingStr || '').split(/\s+/).length;
    S.autoT = setTimeout(next, Voice.on ? 900 : 1500 + words * 140);
  }
  function stopAuto() { clearTimeout(S.autoT); }

  function next() {
    if (S.mode === 'card') return endCard();
    if (S.mode === 'end' || S.mode === 'title' || S.mode === 'menu') return;
    if (S.typing) return finishTyping();
    const ch = STORY[S.ch];
    if (S.line < ch.lines.length - 1) goLine(S.line + 1);
    else if (S.ch < STORY.length - 1) enterChapter(S.ch + 1);
    else showEnd();
  }
  function back() {
    if (S.mode === 'card') return;
    if (S.mode !== 'play') return;
    if (S.line > 0) goLine(S.line - 1);
    else if (S.ch > 0) enterChapter(S.ch - 1, STORY[S.ch - 1].lines.length - 1);
  }

  function show(sel, on) { $(sel).classList.toggle('show', on); }

  function startStory(i = 0) {
    Sound.init();
    if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
    show('#title', false); show('#end', false); show('#menu', false);
    show('#hud', true);
    dlg.classList.add('show');
    andy.style.zIndex = '';
    andy.classList.add('show');
    if (i === 0) {
      andy.classList.remove('beaming'); void andy.offsetWidth; andy.classList.add('beaming');
      setTimeout(() => andy.classList.remove('beaming'), 1800);
    }
    enterChapter(i);
  }

  function showEnd() {
    stopAuto(); stopTyping(); Voice.stop(); clearSceneTimers();
    S.mode = 'end';
    setWarp(.4);
    show('#end', true);
    dlg.classList.remove('show');
    andy.style.zIndex = 11;
    const line = window.STORY_OUTRO;
    const target = $('#endLine');
    target.textContent = '';
    let i = 0;
    andy.classList.add('talking');
    const t = setInterval(() => {
      target.textContent = line.slice(0, ++i);
      if (i % 3 === 0) Sound.blip();
      if (i >= line.length) { clearInterval(t); andy.classList.remove('talking'); }
    }, 30);
    Voice.speak(line);
  }

  let menuFrom = 'title';
  function openMenu() {
    if (S.mode === 'menu') return closeMenu();
    menuFrom = S.mode;
    stopAuto();
    if (S.mode === 'card') endCard();
    S.mode = 'menu';
    show('#menu', true);
  }
  function closeMenu() {
    show('#menu', false);
    S.mode = menuFrom === 'card' ? 'play' : menuFrom;
    maybeAuto();
  }

  /* ---------------------------------------------------------------------------
     Controls
  --------------------------------------------------------------------------- */
  const toggle = (btn, on) => $(btn).classList.toggle('on', on);
  function setAuto(on) { S.auto = on; toggle('#btnAuto', on); if (on) maybeAuto(); else stopAuto(); }
  function setVoice(on) {
    Voice.on = on && 'speechSynthesis' in window; toggle('#btnVoice', Voice.on);
    if (!Voice.on) { Voice.stop(); S.spoken = true; }
  }
  function setSound(on) { Sound.init(); Sound.set(on); toggle('#btnSound', on); }
  toggle('#btnSound', Sound.on);

  $('#btnStart').onclick = () => startStory(0);
  $('#btnReplay').onclick = () => startStory(0);
  $('#btnTitleChapters').onclick = openMenu;
  $('#btnEndChapters').onclick = openMenu;
  $('#btnMenu').onclick = openMenu;
  $('#btnMenuClose').onclick = closeMenu;
  $('#btnNext').onclick = e => { e.stopPropagation(); next(); };
  $('#btnBack').onclick = e => { e.stopPropagation(); back(); };
  $('#btnAuto').onclick = () => setAuto(!S.auto);
  $('#btnVoice').onclick = () => setVoice(!Voice.on);
  $('#btnSound').onclick = () => setSound(!Sound.on);
  $('#menuList').onclick = e => {
    const b = e.target.closest('button[data-ch]');
    if (!b) return;
    show('#menu', false);
    const i = +b.dataset.ch;
    if (menuFrom === 'title' || menuFrom === 'end' || !$('#hud').classList.contains('show')) startStory(i);
    else enterChapter(i);
  };

  stage.addEventListener('click', e => {
    if (e.target.closest('button, a, .screen, #hud')) return;
    next();
  });
  addEventListener('keydown', e => {
    if (e.repeat) return;
    const k = e.key;
    if (S.mode === 'title' && (k === ' ' || k === 'Enter')) { e.preventDefault(); return startStory(0); }
    if (k === ' ' || k === 'Enter' || k === 'ArrowRight') { e.preventDefault(); next(); }
    else if (k === 'ArrowLeft') back();
    else if (k === 'a' || k === 'A') setAuto(!S.auto);
    else if (k === 'v' || k === 'V') setVoice(!Voice.on);
    else if (k === 'm' || k === 'M') setSound(!Sound.on);
    else if (k === 'Escape') openMenu();
  });

  // Title backdrop
  setBackground('uncolored_peaks.png', 'deepspace');
  setWarp(.06);

  // Jump to any beat (handy when reviewing): FutureLab.goto(chapterIndex, lineIndex)
  window.FutureLab = {
    goto(ch, line = 0) {
      show('#menu', false); show('#end', false);
      if (!$('#hud').classList.contains('show')) startStory(ch); else enterChapter(ch);
      S.line = line; endCard();
    }
  };
})();

</script>

  
  
</body>
